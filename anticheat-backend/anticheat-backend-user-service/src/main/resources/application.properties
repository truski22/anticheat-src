# gRPC: same default port (9090) expected by the Gateway
# (USER_SERVICE_GRPC_PORT in anticheat-backend-gateway/grpc/ServiceClients.java).
grpc.server.port=${GRPC_PORT:9090}

# HTTP only for Actuator (k8s health-check on port 9091, same as the
# old utils/HealthServer.java). There is no business @RestController.
server.port=${HEALTH_PORT:9091}
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# PostgreSQL shared with game-service/analysis-service (anticheat-backend-infra).
# DB_HOST is already injected by the "app-config" ConfigMap; DB_USER/DB_PASSWORD by
# the "anticheat-secret" Secret. No H2: data from a restarted pod no longer disappears.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:anticheat}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is created by postgres-init-config (anticheat-backend-infra/docker/init.sql),
# not by this app. schema.sql is kept only as documentation/optional local use.
spring.sql.init.mode=never

user-service.smtp-user=${SMTP_USER:}
user-service.smtp-password=${SMTP_PASSWORD:}
