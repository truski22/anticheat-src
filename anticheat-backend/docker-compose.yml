services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: anticheat
    volumes:
      - ./anticheat-backend-infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  ml-service:
    build:
      context: ./anticheat-backend-ml-service
    environment:
      AUTH_TOKEN: ${ML_SERVICE_TOKEN:-change-me-in-production}
      STOCKFISH_PATH: /usr/games/stockfish
      STOCKFISH_WORKERS: ${STOCKFISH_WORKERS:-10}
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5002/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: anticheat-backend-user-service/Dockerfile
    ports:
      - "9090:9090"
      - "9091:9091"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      GRPC_PORT: "9090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  game-service:
    build:
      context: .
      dockerfile: anticheat-backend-game-service/Dockerfile
    ports:
      - "9092:9091"
      - "9093:9092"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      GRPC_PORT: "9091"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  analysis-service:
    build:
      context: .
      dockerfile: anticheat-backend-analysis-service/Dockerfile
    ports:
      - "9094:9092"
      - "9095:9093"
    environment:
      CHESS_INSIGHTS_URL: http://ml-service:5002/predict
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      GRPC_PORT: "9092"
    depends_on:
      ml-service:
        condition: service_healthy
    restart: on-failure

  gateway:
    build:
      context: .
      dockerfile: anticheat-backend-gateway/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PORT: "8081"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      USER_SERVICE_HOST: user-service
      USER_SERVICE_GRPC_PORT: "9090"
      GAME_SERVICE_HOST: game-service
      GAME_SERVICE_GRPC_PORT: "9091"
      ANALYSIS_SERVICE_HOST: analysis-service
      ANALYSIS_SERVICE_GRPC_PORT: "9092"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      user-service:
        condition: service_started
      game-service:
        condition: service_started
      analysis-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
