# Main HTTP server: REST /auth/** endpoints and the /ws WebSocket endpoint, same
# port (8080) the k8s Service/NodePort already expose (see anticheat-backend-infra/k8s/06-gateway.yaml).
server.port=${PORT:8080}

# Actuator on its own port, like user-service/game-service/analysis-service.
management.server.port=${HEALTH_PORT:8081}
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# JWT signing/verification secret (fails fast at startup if unset - see JwtService).
jwt.secret=${JWT_SECRET:}

# CORS for /auth/** and the WebSocket handshake origin check.
gateway.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# gRPC targets for the three backend services this gateway calls into.
gateway.services.user.host=${USER_SERVICE_HOST:user-service}
gateway.services.user.grpc-port=${USER_SERVICE_GRPC_PORT:9090}
gateway.services.game.host=${GAME_SERVICE_HOST:game-service}
gateway.services.game.grpc-port=${GAME_SERVICE_GRPC_PORT:9091}
gateway.services.analysis.host=${ANALYSIS_SERVICE_HOST:analysis-service}
gateway.services.analysis.grpc-port=${ANALYSIS_SERVICE_GRPC_PORT:9092}

# Redis: backs PasswordResetCodeStore and RateLimiter so both are shared across gateway
# replicas instead of living in a per-pod ConcurrentHashMap.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Circuit breakers around the outgoing gRPC calls in ServiceClients - open after half of
# the last 10 calls to a service fail, stay open 10s, then probe with 3 trial calls.
# minimum-number-of-calls must be set explicitly: it defaults to 100 regardless of
# sliding-window-size, so with a window of 10 the breaker would never have enough
# recorded calls to evaluate the failure rate and could never trip.
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.game-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.game-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.game-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.game-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.game-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.analysis-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.analysis-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.analysis-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.analysis-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.analysis-service.permitted-number-of-calls-in-half-open-state=3
