# Main HTTP server: REST /auth/** endpoints and the /ws WebSocket endpoint, same
# port (8080) the k8s Service/NodePort already expose (see anticheat-backend-infra/k8s/06-gateway.yaml).
server.port=${PORT:8080}

# Actuator on its own port, like user-service/game-service/analysis-service.
management.server.port=${HEALTH_PORT:8081}
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# JWT signing/verification secret (fails fast at startup if unset - see JwtService).
jwt.secret=${JWT_SECRET:}

# CORS for /auth/** and the WebSocket handshake origin check.
gateway.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# gRPC targets for the three backend services this gateway calls into.
gateway.services.user.host=${USER_SERVICE_HOST:user-service}
gateway.services.user.grpc-port=${USER_SERVICE_GRPC_PORT:9090}
gateway.services.game.host=${GAME_SERVICE_HOST:game-service}
gateway.services.game.grpc-port=${GAME_SERVICE_GRPC_PORT:9091}
gateway.services.analysis.host=${ANALYSIS_SERVICE_HOST:analysis-service}
gateway.services.analysis.grpc-port=${ANALYSIS_SERVICE_GRPC_PORT:9092}
