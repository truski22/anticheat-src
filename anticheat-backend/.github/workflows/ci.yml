name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build chessfraud-libs
        run: mvn -f chessfraud-libs/pom.xml install -q -DskipTests
      - name: Cache built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}

  build-gateway:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Restore built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}
      - name: Build gateway
        run: mvn -f gateway/pom.xml package -DskipTests

  build-user-service:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Restore built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}
      - name: Build user-service
        run: mvn -f user-service/pom.xml package -DskipTests

  build-game-service:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Restore built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}
      - name: Build game-service
        run: mvn -f game-service/pom.xml package -DskipTests

  build-analysis-service:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Restore built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}
      - name: Build analysis-service
        run: mvn -f analysis-service/pom.xml package -DskipTests

  test-shared:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Restore built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}
      - name: Run protocol tests
        run: mvn -f chessfraud-libs/protocol/pom.xml test

  test-ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r ml-service/requirements.txt
      - name: Run ML service tests
        run: cd ml-service && python -m pytest -q
