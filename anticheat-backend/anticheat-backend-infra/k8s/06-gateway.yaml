# ──────────────────────────────────────────────
# GATEWAY — WebSocket gateway exposed externally
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # initContainers: containers that run and COMPLETE before the main
      # container starts. They're how Kubernetes manages startup
      # dependencies (equivalent to depends_on in Docker Compose).
      # If an initContainer fails, Kubernetes retries it until it succeeds.
      initContainers:
        - name: wait-for-mosquitto
          image: busybox:1.36
          # nc -z: tries to connect to host:port without sending data.
          # The loop waits until the MQTT broker accepts connections.
          command:
            - sh
            - -c
            - |
              until nc -z mosquitto 1883; do
                echo "Waiting for mosquitto..."; sleep 2
              done
              echo "Mosquitto ready."

      containers:
        - name: gateway
          image: anticheat/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8081
              name: health

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: JWT_SECRET
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ALLOWED_ORIGINS
                  optional: true
            - name: MQTT_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MQTT_BROKER_URL
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: MQTT_USER
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: MQTT_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# NodePort Service: exposes the pod on a port of the NODE (physical machine
# or Kubernetes VM). Allows access from outside the cluster.
# Valid NodePort range: 30000–32767.
#
# Incoming connection flow:
#   Client → node-IP:30080 → Service → Pod:8080
#
# In production you'd use LoadBalancer (provisioned by the cloud provider)
# or an Ingress Controller for TLS and domain-based routing.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: anticheat
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080          # port inside the cluster
      targetPort: 8080    # container port
      nodePort: 30080     # port accessible from outside the cluster
