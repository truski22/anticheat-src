# ──────────────────────────────────────────────
# GATEWAY — WebSocket + REST gateway exposed externally
# ──────────────────────────────────────────────
# Speaks gRPC to user-service/game-service/analysis-service (see
# anticheat-backend-gateway/src/main/java/com/chessfraud/gateway/grpc/ServiceClients.java).
# There is no MQTT broker in this system; the previous version of this manifest carried a
# "wait-for-mosquitto" init container and MQTT_* env vars left over from an earlier
# architecture that the gateway code no longer uses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: anticheat/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8081
              name: health

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: JWT_SECRET
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ALLOWED_ORIGINS
                  optional: true
            # Shared Redis cache: rate limiting and password-reset codes must be visible
            # to every gateway replica, not just the pod that handled the request.
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            # USER_SERVICE_HOST / GAME_SERVICE_HOST / ANALYSIS_SERVICE_HOST are left
            # unset: ServiceClients' defaults (user-service, game-service,
            # analysis-service) already match the Service DNS names these manifests
            # create, same as user-service/game-service/analysis-service's own
            # *_HOST defaults matching "postgres".

          # Correct port and path for the current Spring Boot app (previously pointed at
          # /health on 8081, which was the JDK HttpServer that no longer exists; now it's
          # Actuator with separate liveness/readiness probes, same as the other services).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# NodePort Service: exposes the pod on a port of the NODE (physical machine
# or Kubernetes VM). Allows access from outside the cluster.
# Valid NodePort range: 30000–32767.
#
# Incoming connection flow:
#   Client → node-IP:30080 → Service → Pod:8080
#
# In production you'd use LoadBalancer (provisioned by the cloud provider)
# or an Ingress Controller for TLS and domain-based routing.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: anticheat
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080          # port inside the cluster
      targetPort: 8080    # container port
      nodePort: 30080     # port accessible from outside the cluster
