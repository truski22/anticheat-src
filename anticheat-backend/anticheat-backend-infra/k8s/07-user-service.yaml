# ──────────────────────────────────────────────
# USER-SERVICE — gestión de usuarios (solo MQTT + DB, sin puerto expuesto)
# ──────────────────────────────────────────────
# Este servicio no expone ningún puerto: se comunica únicamente
# a través de MQTT (salida) y PostgreSQL (salida). No necesita un Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-mosquitto
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mosquitto 1883; do
                echo "Esperando a mosquitto..."; sleep 2
              done
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Esperando a postgres..."; sleep 2
              done
              echo "PostgreSQL listo."

      containers:
        - name: user-service
          image: anticheat/user-service:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_PASSWORD
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: SMTP_PASSWORD

          ports:
            - containerPort: 9091
              name: health

          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
