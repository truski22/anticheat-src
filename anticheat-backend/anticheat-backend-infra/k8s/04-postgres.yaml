# ──────────────────────────────────────────────
# POSTGRESQL — database (stateful service)
# ──────────────────────────────────────────────

# PersistentVolumeClaim (PVC): requests persistent storage from the cluster.
# Kubernetes looks for an available PersistentVolume (PV) that satisfies the
# request. The volume survives pod restart/deletion: data is not
# lost even if PostgreSQL restarts.
#
# In Minikube the PV is created automatically (StorageClass "standard").
# In production you'd use a StorageClass from your cloud provider (EBS, GCP PD…).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: anticheat
spec:
  accessModes:
    - ReadWriteOnce     # can be mounted by only one node at a time (typical for databases)
  resources:
    requests:
      storage: 1Gi

---
# StatefulSet: like a Deployment but for stateful services.
# Guarantees:
#   - Stable network identity: the pod is always called "postgres-0"
#   - Startup/shutdown order: they start in order 0,1,2... and stop in reverse
#   - Associated persistence: the PVC is kept even if the pod is deleted
# It's the right resource for databases.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: anticheat
spec:
  serviceName: "postgres"    # name of the headless Service that governs the StatefulSet
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "anticheat"

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U postgres"
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U postgres"
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data    # PostgreSQL persistent data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d  # scripts run on first startup

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-init-config

---
# Headless Service (clusterIP: None): has no virtual IP of its own.
# DNS returns the pod's IP directly (postgres-0.postgres.anticheat…).
# It's mandatory for StatefulSets: it lets each pod have
# a stable, individual DNS name.
# Applications use "postgres" as the hostname and resolve to the correct pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: anticheat
spec:
  clusterIP: None       # headless
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
