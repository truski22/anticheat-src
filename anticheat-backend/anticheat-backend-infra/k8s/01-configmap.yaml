# ConfigMap: stores non-sensitive configuration accessible by pods as
# environment variables or files mounted in volumes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: anticheat
data:
  DB_HOST: "postgres"
  # URL of the Python service consumed by analysis-service
  CHESS_INSIGHTS_URL: "http://ml-service:5002/eval"
  # Path to the Stockfish binary inside the ml-service container
  STOCKFISH_PATH: "/usr/games/stockfish"
  # MQTT broker URL used by all Java services (env var interpolation in mqtt.properties)
  MQTT_BROKER_URL: "tcp://mosquitto:1883"

---
# Mosquitto configuration mounted as a file inside the container
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: anticheat
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true

---
# SQL script executed by PostgreSQL on first startup to create
# the tables needed in the anticheat database
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: anticheat
data:
  init.sql: |
    -- PostgreSQL init script
    CREATE TABLE IF NOT EXISTS users (
        name          VARCHAR(255) PRIMARY KEY,
        email         VARCHAR(255) UNIQUE NOT NULL,
        password      VARCHAR(255) NOT NULL,
        total_games   INT DEFAULT 0,
        cheated_games INT DEFAULT 0,
        fair_games    INT DEFAULT 0
    );

    CREATE TABLE IF NOT EXISTS games (
        id       SERIAL PRIMARY KEY,
        username VARCHAR(255) NOT NULL,
        moves    TEXT         NOT NULL,
        legal    BOOLEAN      NOT NULL
    );
