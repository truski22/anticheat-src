# ──────────────────────────────────────────────
# GAME-SERVICE — game management (MQTT + DB only, no exposed port)
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-service
  template:
    metadata:
      labels:
        app: game-service
    spec:
      initContainers:
        - name: wait-for-mosquitto
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mosquitto 1883; do
                echo "Waiting for mosquitto..."; sleep 2
              done
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done

      containers:
        - name: game-service
          image: anticheat/game-service:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_PASSWORD
            - name: MQTT_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MQTT_BROKER_URL
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: MQTT_USER
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: MQTT_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
