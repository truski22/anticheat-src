# ──────────────────────────────────────────────
# GAME-SERVICE — game management (gRPC :9091 + health HTTP :9092)
# ──────────────────────────────────────────────
# Speaks gRPC (see anticheat-backend-libs/grpc-api/game_service.proto) so as not to break
# anticheat-backend-gateway/grpc/ServiceClients.java, which resolves the host "game-service"
# via Service DNS and dials port 9091. That's why a Service is needed here: without it,
# the Gateway can't resolve "game-service" inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-service
  template:
    metadata:
      labels:
        app: game-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
              echo "PostgreSQL ready."

      containers:
        - name: game-service
          image: anticheat/game-service:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: DB_PASSWORD

          ports:
            - containerPort: 9091
              name: grpc
            - containerPort: 9092
              name: health

          # Actuator, same as user-service: separate liveness/readiness probes,
          # readiness includes the state of the Postgres connection.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"

---
# ClusterIP Service: gives the pod the DNS name "game-service" that
# ServiceClients.java already uses by default (GAME_SERVICE_HOST).
apiVersion: v1
kind: Service
metadata:
  name: game-service
  namespace: anticheat
spec:
  selector:
    app: game-service
  ports:
    - name: grpc
      port: 9091
      targetPort: 9091
    - name: health
      port: 9092
      targetPort: 9092

---
# NetworkPolicy: the gRPC channel (9091) is plaintext (ServiceClients.java uses
# usePlaintext(), no token or mTLS) — restrict who can call at all to the Gateway, by
# network. Port 9092 (health) is left unrestricted so the kubelet can always run the probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: game-service-ingress
  namespace: anticheat
spec:
  podSelector:
    matchLabels:
      app: game-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 9091
