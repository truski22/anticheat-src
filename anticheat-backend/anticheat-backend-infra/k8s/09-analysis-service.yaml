# ──────────────────────────────────────────────
# ANALYSIS-SERVICE — analysis orchestrator (gRPC :9092 + health HTTP :9093, HTTP to ml-service)
# ──────────────────────────────────────────────
# Speaks gRPC (see anticheat-backend-libs/grpc-api/analysis_service.proto) so as not to
# break anticheat-backend-gateway/grpc/ServiceClients.java, which resolves the host
# "analysis-service" via Service DNS and dials port 9092. That's why a Service is needed
# here: without it, the Gateway can't resolve "analysis-service" inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      initContainers:
        - name: wait-for-ml-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ml-service 5002; do
                echo "Waiting for ml-service..."; sleep 2
              done
              echo "ml-service ready."

      containers:
        - name: analysis-service
          image: anticheat/analysis-service:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: CHESS_INSIGHTS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CHESS_INSIGHTS_URL
            - name: ML_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: ML_SERVICE_TOKEN

          ports:
            - containerPort: 9092
              name: grpc
            - containerPort: 9093
              name: health

          # Actuator, same as user-service/game-service: separate liveness/readiness probes.
          # No "db" component here (this service has no database), just readinessState/liveness.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"

---
# ClusterIP Service: gives the pod the DNS name "analysis-service" that
# ServiceClients.java already uses by default (ANALYSIS_SERVICE_HOST).
apiVersion: v1
kind: Service
metadata:
  name: analysis-service
  namespace: anticheat
spec:
  selector:
    app: analysis-service
  ports:
    - name: grpc
      port: 9092
      targetPort: 9092
    - name: health
      port: 9093
      targetPort: 9093

---
# NetworkPolicy: the gRPC channel (9092) is plaintext (ServiceClients.java uses
# usePlaintext(), no token or mTLS) — restrict who can call at all to the Gateway, by
# network. Port 9093 (health) is left unrestricted so the kubelet can always run the probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analysis-service-ingress
  namespace: anticheat
spec:
  podSelector:
    matchLabels:
      app: analysis-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 9092
