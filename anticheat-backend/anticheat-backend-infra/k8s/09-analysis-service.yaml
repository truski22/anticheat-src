# ──────────────────────────────────────────────
# ANALYSIS-SERVICE — orquestador de análisis (MQTT + HTTP a ml-service)
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      initContainers:
        - name: wait-for-mosquitto
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mosquitto 1883; do
                echo "Esperando a mosquitto..."; sleep 2
              done
        - name: wait-for-ml-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z ml-service 5002; do
                echo "Esperando a ml-service..."; sleep 2
              done
              echo "ml-service listo."

      containers:
        - name: analysis-service
          image: anticheat/analysis-service:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: CHESS_INSIGHTS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CHESS_INSIGHTS_URL
            - name: ML_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: ML_SERVICE_TOKEN
            - name: MQTT_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MQTT_BROKER_URL
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: MQTT_USER
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: MQTT_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
