# ──────────────────────────────────────────────
# ML-SERVICE — servicio Python/Flask de análisis ML
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: anticheat/ml-service:latest
          # IfNotPresent: usa la imagen local si existe; no intenta descargarla.
          # Necesario cuando trabajas con imágenes construidas localmente
          # en Minikube o Kind sin registry externo.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002

          env:
            # envFrom.configMapRef: inyecta TODAS las claves de un ConfigMap
            # como variables de entorno. Más cómodo que declararlas una a una.
            - name: STOCKFISH_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: STOCKFISH_PATH
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: AUTH_TOKEN

          # HTTP probe: Kubernetes hace una petición GET al endpoint indicado.
          # Si responde 2xx/3xx → listo. Si falla → pod no recibe tráfico (readiness)
          # o se reinicia (liveness).
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 40
            periodSeconds: 20

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: anticheat
spec:
  selector:
    app: ml-service
  ports:
    - port: 5002
      targetPort: 5002
