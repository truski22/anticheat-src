# ──────────────────────────────────────────────
# ML-SERVICE — Python/Flask ML analysis service
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: anticheat/ml-service:latest
          # IfNotPresent: uses the local image if it exists; doesn't try to pull it.
          # Needed when working with images built locally
          # in Minikube or Kind without an external registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002

          env:
            # envFrom.configMapRef: injects ALL keys from a ConfigMap
            # as environment variables. More convenient than declaring them one by one.
            - name: STOCKFISH_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: STOCKFISH_PATH
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anticheat-secret
                  key: AUTH_TOKEN

          # HTTP probe: Kubernetes makes a GET request to the given endpoint.
          # If it responds 2xx/3xx → ready. If it fails → pod gets no traffic (readiness)
          # or gets restarted (liveness).
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 40
            periodSeconds: 20

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: anticheat
spec:
  selector:
    app: ml-service
  ports:
    - port: 5002
      targetPort: 5002
