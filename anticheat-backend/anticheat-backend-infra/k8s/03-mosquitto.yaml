# ──────────────────────────────────────────────
# MOSQUITTO — internal MQTT broker
# ──────────────────────────────────────────────

# Deployment: describes stateless pods.
# Kubernetes takes care of maintaining the desired number of replicas
# and restarting the pod if it fails.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: anticheat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto        # Kubernetes uses these labels to know which pods this Deployment manages
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883

          # readinessProbe: Kubernetes doesn't send traffic to the pod until
          # this probe succeeds. Prevents other services from connecting
          # before the broker is ready.
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10

          # livenessProbe: if it fails, Kubernetes restarts the container.
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 15
            periodSeconds: 20

          # resources: declares how much CPU and memory the container needs.
          # requests = guaranteed minimum for scheduling.
          # limits = maximum it can consume before being throttled (CPU)
          #          or killed (OOMKilled, memory).
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          # volumeMounts: mount points inside the container
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf   # mounts only that file, not the whole directory

      # volumes: declares the volumes available to the pod.
      # Here we use a ConfigMap as the source of a configuration file.
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-config

---
# Service: exposes the pods internally within the cluster.
# ClusterIP (default) assigns a stable virtual IP.
# Any pod can connect to "mosquitto:1883" and Kubernetes
# routes the request to the right pod via kube-proxy.
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: anticheat
spec:
  selector:
    app: mosquitto        # selects the pods with this label
  ports:
    - port: 1883          # Service port (what clients use)
      targetPort: 1883    # container port it redirects to
