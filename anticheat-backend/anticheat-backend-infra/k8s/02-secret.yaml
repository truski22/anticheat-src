# Secret: same as a ConfigMap but the values are stored in base64
# and Kubernetes treats them with more care (not shown in logs, etc.).
# IMPORTANT: Do not commit real values here. In production these values
# should come from an external secrets manager
# (HashiCorp Vault, AWS Secrets Manager, Sealed Secrets, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: anticheat-secret
  namespace: anticheat
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  AUTH_TOKEN: "CHANGE_ME"
  ML_SERVICE_TOKEN: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
