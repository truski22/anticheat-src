# Secret: igual que un ConfigMap pero los valores se almacenan en base64
# y Kubernetes los trata con mayor cuidado (no se muestran en logs, etc.).
# IMPORTANTE: No commitear valores reales aquí. En producción estos valores
# deben provenir de un gestor de secretos externo
# (HashiCorp Vault, AWS Secrets Manager, Sealed Secrets, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: anticheat-secret
  namespace: anticheat
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  AUTH_TOKEN: "CHANGE_ME"
  ML_SERVICE_TOKEN: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  MQTT_USER: "CHANGE_ME"
  MQTT_PASSWORD: "CHANGE_ME"
