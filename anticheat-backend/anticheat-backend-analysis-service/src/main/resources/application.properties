# gRPC: same default port (9092) expected by the Gateway
# (ANALYSIS_SERVICE_GRPC_PORT in anticheat-backend-gateway/grpc/ServiceClients.java).
grpc.server.port=${GRPC_PORT:9092}

# HTTP only for Actuator (k8s health-check on port 9093, same as the
# old utils/HealthServer.java). There is no business @RestController.
server.port=${HEALTH_PORT:9093}
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState

# ml-service HTTP endpoint + bearer token, injected by the "app-config" ConfigMap
# and "anticheat-secret" Secret respectively.
analysis-service.chess-insights-url=${CHESS_INSIGHTS_URL:http://localhost:5002/predict}
analysis-service.ml-service-token=${ML_SERVICE_TOKEN:}
