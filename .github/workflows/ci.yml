name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # --- Change detection ----------------------------------------------------
  # Standard GitHub Actions equivalent of GitLab CI "child pipelines": a
  # single detection job (dorny/paths-filter, the de-facto standard action
  # for this) decides which parts of the monorepo changed, and every
  # per-service job below only runs when it actually needs to. This keeps CI
  # fast on monorepo PRs that touch a single service instead of always
  # building/testing all five backend services.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.filter.outputs.libs }}
      gateway: ${{ steps.filter.outputs.gateway }}
      user-service: ${{ steps.filter.outputs.user-service }}
      game-service: ${{ steps.filter.outputs.game-service }}
      analysis-service: ${{ steps.filter.outputs.analysis-service }}
      ml-service: ${{ steps.filter.outputs.ml-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            libs:
              - 'anticheat-backend/anticheat-backend-libs/**'
            gateway:
              - 'anticheat-backend/anticheat-backend-gateway/**'
            user-service:
              - 'anticheat-backend/anticheat-backend-user-service/**'
            game-service:
              - 'anticheat-backend/anticheat-backend-game-service/**'
            analysis-service:
              - 'anticheat-backend/anticheat-backend-analysis-service/**'
            ml-service:
              - 'anticheat-backend/anticheat-backend-ml-service/**'

  # Every Java service below resolves anticheat-backend-libs (protocol +
  # grpc-api) as a plain Maven dependency from the local repo, not via a
  # reactor -am build, so it must be installed on every run regardless of
  # whether libs itself changed. This job stays unconditional (it's cheap:
  # no tests here, just `install`); libs' own tests run in test-shared,
  # which IS gated on libs actually changing.
  build-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build anticheat-backend-libs
        run: mvn -f anticheat-backend/anticheat-backend-libs/pom.xml install -q
      - name: Cache built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}

  # --- Per-service "child pipelines" ---------------------------------------
  # Each Java service calls the same reusable workflow and only runs when
  # its own module changed OR anticheat-backend-libs changed (a libs change
  # can break any consumer, so it's never safe to skip them in that case).
  gateway:
    needs: [detect-changes, build-libs]
    if: needs.detect-changes.outputs.gateway == 'true' || needs.detect-changes.outputs.libs == 'true'
    uses: ./.github/workflows/_build-java-service.yml
    with:
      module-path: anticheat-backend/anticheat-backend-gateway
      display-name: gateway

  user-service:
    needs: [detect-changes, build-libs]
    if: needs.detect-changes.outputs.user-service == 'true' || needs.detect-changes.outputs.libs == 'true'
    uses: ./.github/workflows/_build-java-service.yml
    with:
      module-path: anticheat-backend/anticheat-backend-user-service
      display-name: user-service

  game-service:
    needs: [detect-changes, build-libs]
    if: needs.detect-changes.outputs.game-service == 'true' || needs.detect-changes.outputs.libs == 'true'
    uses: ./.github/workflows/_build-java-service.yml
    with:
      module-path: anticheat-backend/anticheat-backend-game-service
      display-name: game-service

  analysis-service:
    needs: [detect-changes, build-libs]
    if: needs.detect-changes.outputs.analysis-service == 'true' || needs.detect-changes.outputs.libs == 'true'
    uses: ./.github/workflows/_build-java-service.yml
    with:
      module-path: anticheat-backend/anticheat-backend-analysis-service
      display-name: analysis-service

  test-shared:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-libs]
    if: needs.detect-changes.outputs.libs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Restore built libs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/chessfraud
          key: chessfraud-libs-${{ github.sha }}
      - name: Run protocol tests
        run: mvn -f anticheat-backend/anticheat-backend-libs/protocol/pom.xml test

  test-ml-service:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ml-service == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r anticheat-backend/anticheat-backend-ml-service/requirements.txt
      - name: Run ML service tests
        run: cd anticheat-backend/anticheat-backend-ml-service && python -m pytest -q

  # --- Aggregator ------------------------------------------------------------
  # Branch protection "required checks" need a job with a fixed name that
  # always runs: skipped conditional jobs don't reliably count as passing
  # required checks. This job fails if anything that DID run failed/was
  # cancelled, and passes if the rest were legitimately skipped.
  ci-success:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-libs
      - gateway
      - user-service
      - game-service
      - analysis-service
      - test-shared
      - test-ml-service
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped as expected."
