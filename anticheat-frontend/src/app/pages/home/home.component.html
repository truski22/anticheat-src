<div class="auth-page">
  <div class="card">
    <h1 class="card-title">Anti-Cheat</h1>
    <p class="card-subtitle">Detección de trampas en ajedrez</p>

    <div class="floating-field">
      <input type="text" id="user" placeholder=" " [(ngModel)]="user" name="user" (keydown.enter)="login()">
      <label for="user">Usuario</label>
    </div>

    <div class="floating-field">
      <input type="password" id="password" placeholder=" " [(ngModel)]="password" name="psw" (keydown.enter)="login()">
      <label for="password">Contraseña</label>
    </div>

    <button class="btn btn-primary btn-block" (click)="login()" [disabled]="!user || !password || loading">
      <span *ngIf="!loading">Iniciar sesión</span>
      <div *ngIf="loading" class="spinner spinner-sm spinner-white"></div>
    </button>

    <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

    <div class="divider"></div>

    <div class="auth-links">
      <button class="btn btn-outline btn-block" (click)="goToRegister()">Crear una cuenta</button>
      <a class="btn-ghost" (click)="resetPassword()">¿Has olvidado la contraseña?</a>
    </div>
  </div>
</div>
