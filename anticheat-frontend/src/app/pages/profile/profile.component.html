<app-navbar activePage="profile"></app-navbar>

<div class="page-content">
  <div class="container" *ngIf="dataLoaded; else loading">
    <div class="profile-layout">
      <!-- Left: user info -->
      <div class="profile-card">
        <div class="profile-avatar">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>

        <div class="info-row">
          <span class="info-label">Usuario</span>
          <span class="info-value" *ngIf="user">{{ user }}</span>
        </div>

        <div class="info-row">
          <span class="info-label">Correo</span>
          <span class="info-value" *ngIf="correoUser">{{ correoUser }}</span>
        </div>

        <div class="profile-actions">
          <button class="btn btn-outline btn-block" (click)="changePassword()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Cambiar contraseña
          </button>
          <button class="btn btn-danger btn-block" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>

      <!-- Right: stats -->
      <div class="stats-panel">
        <div class="stat-card stat-total">
          <span class="stat-number">{{ numPartidas }}</span>
          <span class="stat-label">Partidas analizadas</span>
        </div>
        <div class="stat-row">
          <div class="stat-card stat-legal">
            <span class="stat-number">{{ numPartidasLegales }}</span>
            <span class="stat-label">Legales</span>
          </div>
          <div class="stat-card stat-cheat">
            <span class="stat-number">{{ numPartidasTrampa }}</span>
            <span class="stat-label">Trampas</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="spinner-center">
    <div class="spinner"></div>
  </div>
</ng-template>
