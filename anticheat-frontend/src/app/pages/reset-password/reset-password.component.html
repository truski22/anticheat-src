<div class="auth-page">
  <div class="card">
    <h1 class="card-title">¿Contraseña olvidada?</h1>
    <p class="card-subtitle">
      Introduce tu correo electrónico y te enviaremos un código de confirmación para poder cambiar tu contraseña.
    </p>

    <div class="floating-field">
      <input type="email" id="reset-email" placeholder=" " [(ngModel)]="email" name="correoPSWol">
      <label for="reset-email">Correo electrónico</label>
    </div>

    <button class="btn btn-primary btn-block" (click)="sendEmail()" [disabled]="!email || waiting">
      <span *ngIf="!waiting">Enviar código</span>
      <div *ngIf="waiting" class="spinner spinner-sm spinner-white"></div>
    </button>

    <div class="divider"></div>
    <p class="back-link"><a class="btn-ghost" href="/">Volver al inicio de sesión</a></p>
  </div>
</div>
