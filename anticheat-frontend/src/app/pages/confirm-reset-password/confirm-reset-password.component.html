<div class="auth-page">
  <div class="card">
    <h1 class="card-title">Verificar código</h1>
    <p class="card-subtitle">Introduce el código enviado a tu correo y tu nueva contraseña</p>

    <div class="floating-field">
      <input type="text" id="conf-code" placeholder=" " [(ngModel)]="code" name="verificationCode" maxlength="6" required>
      <label for="conf-code">Código de 6 dígitos</label>
    </div>

    <div class="floating-field">
      <input type="password" id="conf-psw" placeholder=" " [(ngModel)]="newPassword" name="cambioPSW" required>
      <label for="conf-psw">Nueva contraseña</label>
    </div>

    <div class="floating-field">
      <input type="password" id="conf-psw-confirm" placeholder=" " [(ngModel)]="confirmPassword" name="cambioPSWConf" required>
      <label for="conf-psw-confirm">Confirmar contraseña</label>
    </div>

    <button class="btn btn-primary btn-block" (click)="changePassword()"
            [disabled]="!code || !newPassword || !confirmPassword || loading">
      <span *ngIf="!loading">Confirmar</span>
      <div *ngIf="loading" class="spinner spinner-sm spinner-white"></div>
    </button>

    <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
  </div>
</div>
