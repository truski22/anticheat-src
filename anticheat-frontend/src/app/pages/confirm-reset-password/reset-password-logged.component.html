<div class="auth-page">
  <div class="card">
    <h1 class="card-title">Cambiar contraseña</h1>
    <p class="card-subtitle">Introduce tu nueva contraseña</p>

    <div class="floating-field">
      <input type="password" id="logged-psw" placeholder=" " [(ngModel)]="newPassword" name="cambioPSW" required>
      <label for="logged-psw">Nueva contraseña</label>
    </div>

    <div class="floating-field">
      <input type="password" id="logged-psw-confirm" placeholder=" " [(ngModel)]="confirmPassword" name="cambioPSWConf" required>
      <label for="logged-psw-confirm">Confirmar contraseña</label>
    </div>

    <button class="btn btn-primary btn-block" (click)="changePassword()"
            [disabled]="!newPassword || !confirmPassword || loading">
      <span *ngIf="!loading">Cambiar contraseña</span>
      <div *ngIf="loading" class="spinner spinner-sm spinner-white"></div>
    </button>

    <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
  </div>
</div>
